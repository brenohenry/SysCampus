<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumen Veritas | SysCampus</title>
<style>
  :root{
    --navy: #0f2547;
    --navy-dark: #0a1a34;
    --ink: #1c1f26;
    --muted: #6b7280;
    --border: #d9dce2;
    --bg: #fbfbfc;
    --error: #c0392b;
    --success: #1e7a4c;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,"Segoe UI",Inter,Arial,sans-serif; color:var(--ink); background:var(--bg); }
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding:20px 40px; border-bottom:1px solid var(--border); background:#fff; position:relative; z-index:5; }
  .logo{ display:flex; align-items:center; gap:12px; font-family:"Georgia","Times New Roman",serif; }
  .logo .crest{ width:38px;height:32px; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; font-size:13px; letter-spacing:1px; font-weight:700; border-radius:2px; }
  .logo .crest span{opacity:.85}
  .logo .name{ line-height:1.05; }
  .logo .name b{ display:block; font-size:20px; font-weight:700; }
  .logo .name i{ display:block; font-size:20px; font-style:italic; margin-left:6px; }
  .nav-buttons{ display:flex; gap:14px; }
  .nav-btn{ display:flex; align-items:center; gap:8px; padding:10px 18px; border:1px solid var(--border); border-radius:8px; background:#fff; font-size:14px; color:#333; cursor:pointer; transition:all .15s ease; }
  .nav-btn:hover{ border-color:#aeb4bf; }
  .nav-btn.active{ border-color:var(--navy); color:var(--navy); background:#f0f4fa; font-weight:600; }
  .nav-btn svg{ width:16px;height:16px; }
  .hero{ position:relative; min-height:88vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:60px 20px 80px; overflow:hidden; }
  .hero-bg{ position:absolute; inset:0; opacity:0.055; z-index:0; pointer-events:none; }
  .hero-content{ position:relative; z-index:1; display:flex; flex-direction:column; align-items:center; width:100%; }
  .title{ font-family:"Georgia","Times New Roman",serif; font-size:56px; margin:0 0 34px 0; display:flex; align-items:baseline; gap:14px; color:#111; }
  .title i{ font-style:italic; font-weight:400; }
  .title b{ font-weight:700; letter-spacing:1px; }
  .card{ background:#fff; border-radius:14px; box-shadow:0 10px 40px rgba(15,37,71,0.08), 0 2px 8px rgba(0,0,0,0.04); padding:34px 36px 30px; width:100%; max-width:460px; }
  .card-title{ font-size:15px; font-weight:700; color:#111; margin:0 0 18px 0; }
  .field{ margin-bottom:18px; }
  .field label{ display:block; font-size:14px; margin-bottom:8px; color:#222; font-weight:500; }
  .input-wrap{ display:flex; align-items:center; border:1px solid var(--border); border-radius:8px; padding:0 12px; background:#fff; transition:border-color .15s ease; }
  .input-wrap:focus-within{ border-color:var(--navy); }
  .input-wrap svg{ flex-shrink:0; color:#8a8f99; }
  .input-wrap input{ border:none; outline:none; padding:13px 10px; width:100%; font-size:14px; background:transparent; color:var(--ink); }
  .input-wrap button.eye{ background:none; border:none; cursor:pointer; color:#8a8f99; display:flex; padding:4px; }
  .enter-btn{ width:100%; padding:14px; background:var(--navy); color:#fff; border:none; border-radius:8px; font-size:15px; font-weight:600; cursor:pointer; margin-top:6px; transition:background .15s ease; }
  .enter-btn:hover{ background:var(--navy-dark); }
  .enter-btn.secondary{ background:#fff; color:var(--navy); border:1px solid var(--navy); margin-top:10px; }
  .enter-btn.secondary:hover{ background:#f0f4fa; }
  .forgot{ display:block; text-align:center; margin-top:18px; font-size:14px; color:#2255a4; text-decoration:none; cursor:pointer; background:none; border:none; width:100%; }
  .forgot:hover{ text-decoration:underline; }
  .switch-view{ text-align:center; margin-top:20px; font-size:14px; color:var(--muted); border-top:1px solid var(--border); padding-top:16px; }
  .switch-view button{ background:none; border:none; color:#2255a4; font-weight:600; cursor:pointer; font-size:14px; padding:0; }
  .switch-view button:hover{ text-decoration:underline; }
  .message{ margin-top:14px; font-size:13.5px; text-align:center; padding:9px 10px; border-radius:7px; display:none; }
  .message.show{ display:block; }
  .message.error{ background:#fdecea; color:var(--error); }
  .message.success{ background:#e9f7ef; color:var(--success); }
  .message.info{ background:#f1f2f5; color:#333; }
  .hint{ text-align:center; font-size:12px; color:var(--muted); margin-top:16px; line-height:1.5; }
  .hint code{ background:#f1f2f5; padding:1px 5px; border-radius:4px; }
  .view{ display:none; }
  .view.active{ display:block; }
  @media (max-width:520px){ .topbar{ padding:16px 18px; flex-wrap:wrap; gap:12px; } .title{ font-size:38px; } .card{ padding:26px 22px; } }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">
    <div class="crest"><span>A</span><span style="opacity:.5">|</span><span>Ω</span></div>
    <div class="name"><b>Lumen</b><i>Veritas</i></div>
  </div>
  <div class="nav-buttons">
    <button class="nav-btn active" id="btn-usuario" onclick="setMode('usuario')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      Área do usuário
    </button>
    <button class="nav-btn" id="btn-admin" onclick="setMode('administrador')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/></svg>
      Área do Administrador
    </button>
  </div>
</div>

<div class="hero">
  <svg class="hero-bg" viewBox="0 0 1400 800" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
    <g fill="#111">
      <polygon points="200,260 700,80 1200,260 1150,260 700,140 250,260" />
      <rect x="230" y="260" width="940" height="18"/>
      <rect x="270" y="278" width="20" height="330"/><rect x="340" y="278" width="20" height="330"/>
      <rect x="410" y="278" width="20" height="330"/><rect x="480" y="278" width="20" height="330"/>
      <rect x="620" y="278" width="20" height="330"/><rect x="690" y="278" width="20" height="330"/>
      <rect x="760" y="278" width="20" height="330"/><rect x="900" y="278" width="20" height="330"/>
      <rect x="970" y="278" width="20" height="330"/><rect x="1040" y="278" width="20" height="330"/>
      <rect x="1100" y="278" width="20" height="330"/>
      <rect x="180" y="608" width="1040" height="20"/>
      <rect x="150" y="628" width="1100" height="16"/>
      <rect x="120" y="644" width="1160" height="16"/>
      <text x="330" y="360" font-family="Georgia,serif" font-size="26" letter-spacing="6" fill="#111">LUMEN VERITAS</text>
      <circle cx="700" cy="150" r="26" fill="none" stroke="#111" stroke-width="4"/>
      <line x1="700" y1="150" x2="700" y2="132" stroke="#111" stroke-width="3"/>
      <line x1="700" y1="150" x2="712" y2="150" stroke="#111" stroke-width="3"/>
      <rect x="1230" y="120" width="60" height="200"/>
      <polygon points="1230,120 1260,60 1290,120"/>
      <rect x="1250" y="40" width="20" height="24"/>
      <rect x="560" y="660" width="280" height="14"/><rect x="580" y="674" width="240" height="14"/>
      <rect x="600" y="688" width="200" height="14"/>
      <rect x="1330" y="420" width="8" height="260"/>
      <circle cx="1334" cy="410" r="16" fill="none" stroke="#111" stroke-width="3"/>
      <rect x="80" y="700" width="140" height="8"/><rect x="90" y="708" width="8" height="30"/>
      <rect x="200" y="708" width="8" height="30"/>
      <rect x="1180" y="700" width="140" height="8"/><rect x="1190" y="708" width="8" height="30"/>
      <rect x="1300" y="708" width="8" height="30"/>
    </g>
  </svg>

  <div class="hero-content">
    <div class="title"><i>Sys</i><b>CAMPUS</b></div>

    <div class="card">
      <div class="view active" id="view-login">
        <form id="login-form" onsubmit="return handleLogin(event)">
          <div class="field">
            <label for="id">ID</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <input type="text" id="id" placeholder="Insira seu ID" autocomplete="username" required>
            </div>
          </div>
          <div class="field">
            <label for="senha">Senha</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
              <input type="password" id="senha" placeholder="Insira sua senha" autocomplete="current-password" required>
              <button type="button" class="eye" onclick="toggleVisibility('senha')" aria-label="Mostrar senha">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="enter-btn">Entrar</button>
          <button type="button" class="forgot" onclick="handleForgot()">Esqueceu sua senha?</button>
        </form>
        <div class="switch-view">Não tem uma conta? <button type="button" onclick="showView('register')">Criar conta</button></div>
      </div>

      <div class="view" id="view-register">
        <p class="card-title">Criar nova conta (<span id="register-mode-label">usuário</span>)</p>
        <form id="register-form" onsubmit="return handleRegister(event)">
          <div class="field">
            <label for="reg-nome">Nome completo</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
              <input type="text" id="reg-nome" placeholder="Seu nome completo" required>
            </div>
          </div>
          <div class="field">
            <label for="reg-id">ID</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9h18"/></svg>
              <input type="text" id="reg-id" placeholder="Escolha um ID" required>
            </div>
          </div>
          <div class="field">
            <label for="reg-senha">Senha</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
              <input type="password" id="reg-senha" placeholder="Crie uma senha" autocomplete="new-password" required>
              <button type="button" class="eye" onclick="toggleVisibility('reg-senha')" aria-label="Mostrar senha">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <div class="field">
            <label for="reg-senha2">Confirmar senha</label>
            <div class="input-wrap">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="9" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>
              <input type="password" id="reg-senha2" placeholder="Repita a senha" autocomplete="new-password" required>
              <button type="button" class="eye" onclick="toggleVisibility('reg-senha2')" aria-label="Mostrar senha">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="enter-btn">Criar conta</button>
          <button type="button" class="enter-btn secondary" onclick="showView('login')">Voltar para o login</button>
        </form>
      </div>

      
  </div>
</div>

<script>
/* Banco de dados compartilhado com a página gestao.html via localStorage */
let mode = 'usuario';
const DB_KEY = 'syscampus:users';
const SESSION_KEY = 'syscampus:session';

function seedDatabase(){
  if(!localStorage.getItem(DB_KEY)){
    const seed = [
      { id: '2024001', senha: 'senha123', tipo: 'usuario', nome: 'Ana Souza' },
      { id: '2024002', senha: 'senha123', tipo: 'usuario', nome: 'Bruno Alves' },
      { id: 'admin01', senha: 'admin123', tipo: 'administrador', nome: 'Carlos Lima' }
    ];
    localStorage.setItem(DB_KEY, JSON.stringify(seed));
  }
}
function getUsers(){
  try{ const raw = localStorage.getItem(DB_KEY); return raw ? JSON.parse(raw) : []; }
  catch(e){ return []; }
}
function saveUsers(users){
  try{ localStorage.setItem(DB_KEY, JSON.stringify(users)); return true; }
  catch(e){ return false; }
}

function setMode(m){
  mode = m;
  document.getElementById('btn-usuario').classList.toggle('active', m==='usuario');
  document.getElementById('btn-admin').classList.toggle('active', m==='administrador');
  document.getElementById('register-mode-label').textContent = m === 'administrador' ? 'administrador' : 'usuário';
  clearMessage();
}
function showView(view){
  document.getElementById('view-login').classList.toggle('active', view === 'login');
  document.getElementById('view-register').classList.toggle('active', view === 'register');
  clearMessage();
}
function toggleVisibility(inputId){
  const input = document.getElementById(inputId);
  input.type = input.type === 'password' ? 'text' : 'password';
}
function showMessage(text, type){
  const el = document.getElementById('message');
  el.textContent = text;
  el.className = 'message show' + (type ? ' ' + type : '');
}
function clearMessage(){
  const el = document.getElementById('message');
  el.textContent = ''; el.className = 'message';
}

function handleLogin(ev){
  ev.preventDefault();
  const id = document.getElementById('id').value.trim();
  const senha = document.getElementById('senha').value;

  const users = getUsers();
  const found = users.find(u => u.id === id && u.senha === senha && u.tipo === mode);

  if(found){
    sessionStorage.setItem(SESSION_KEY, JSON.stringify(found));
    showMessage('Bem-vindo(a), ' + found.nome + '! Redirecionando...', 'success');
    setTimeout(() => { window.location.href = 'gestao.html'; }, 600);
  } else {
    const existsOtherType = users.find(u => u.id === id && u.senha === senha);
    if(existsOtherType){
      showMessage('Credenciais válidas, mas não correspondem à área selecionada.', 'error');
    } else {
      showMessage('ID ou senha inválidos.', 'error');
    }
  }
  return false;
}

function handleRegister(ev){
  ev.preventDefault();
  const nome = document.getElementById('reg-nome').value.trim();
  const id = document.getElementById('reg-id').value.trim();
  const senha = document.getElementById('reg-senha').value;
  const senha2 = document.getElementById('reg-senha2').value;

  if(senha !== senha2){ showMessage('As senhas não coincidem.', 'error'); return false; }
  if(senha.length < 6){ showMessage('A senha deve ter pelo menos 6 caracteres.', 'error'); return false; }

  const users = getUsers();
  if(users.find(u => u.id === id)){ showMessage('Esse ID já está em uso. Escolha outro.', 'error'); return false; }

  users.push({ id, senha, tipo: mode, nome });
  const saved = saveUsers(users);

  if(saved){
    showMessage('Conta criada com sucesso! Você já pode entrar.', 'success');
    document.getElementById('register-form').reset();
    setTimeout(() => showView('login'), 1200);
  } else {
    showMessage('Não foi possível criar a conta. Tente novamente.', 'error');
  }
  return false;
}

function handleForgot(){
  showMessage('Entre em contato com a secretaria acadêmica para redefinir sua senha.', 'info');
}

seedDatabase();
</script>

</body>
</html>
