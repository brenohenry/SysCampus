<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recuperar senha — SysCampus</title>
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="home-page">
<header class="topbar login-topbar">
  <div class="login-brand-logos" aria-label="Lumen Veritas e SysCampus">
    <img src="assets/img/logo_lumenveritas.png" alt="Lumen Veritas" class="login-logo login-logo-lumen">
    <span class="login-logo-divider" aria-hidden="true"></span>
    <img src="assets/img/logo_syscampus.png" alt="SysCampus" class="login-logo login-logo-sys">
  </div>
</header>
<main class="hero">
  <div class="hero-overlay"></div>
  <section class="login-card" id="recoverCard">
    <div class="login-context">Recuperação de senha</div>
    <p class="hint">Informe o e-mail cadastrado. Se a conta existir, enviaremos um link para redefinir sua senha.</p>
    <form id="recoverForm">
      <label for="email">E-mail</label>
      <div class="input-wrap"><span>✉</span><input id="email" name="email" type="email" autocomplete="email" placeholder="seu@email.com" required></div>
      <button class="primary-btn" type="submit">Enviar link de recuperação</button>
      <a href="index.html#login" class="forgot">Voltar para o login</a>
      <div id="recoverMsg" class="msg" role="status"></div>
    </form>
  </section>
</main>
<script src="assets/js/app.js?v=20260915-r3"></script>
<script>
document.getElementById('recoverForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg=document.getElementById('recoverMsg');
  msg.textContent='Enviando...';
  try {
    const d=await req('auth.php?action=forgot-password',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value.trim()})});
    msg.textContent=d.message;
  } catch(err) { msg.textContent=err.message; }
});
</script>
</body></html>
